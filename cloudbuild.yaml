# This Cloud Build configuration file is required to solve the organization's 
# "service_account logging" permission error.

steps:
# Step 1: Build the Docker Image using the Dockerfile located in the repository root (.).
# The resulting image is tagged with the Project ID and Commit SHA.
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/teaching-agent-api:$COMMIT_SHA', '.']

# Step 2: Deploy the built image to the existing Cloud Run service.
# This uses a separate tool (gcloud run) that requires the target service name.
- name: 'gcr.io/google.com/cloudsdk/cloud-sdk'
  args: [
      'gcloud', 'run', 'deploy', 'teaching-agent-api',
      '--image', 'gcr.io/$PROJECT_ID/teaching-agent-api:$COMMIT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      # NOTE: These variables are replaced by the values entered in the Cloud Build Trigger UI
      '--set-env-vars', 'OPENAI_API_KEY=${_OPENAI_API_KEY},DB_HOST=${_DB_HOST},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME}'
  ]
  # IMPORTANT: The build requires a working directory with the gcloud SDK installed
  dir: '.'
  
options:
  # CRITICAL FIX: Forces logs to Cloud Logging. This is the only way to satisfy 
  # the security policy that checks the service account permissions.
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Define placeholders for sensitive environment variables that the trigger must provide.
  # The values are intentionally left blank in the file for security.
  _OPENAI_API_KEY: ""
  _DB_HOST: ""
  _DB_USER: ""
  _DB_PASS: ""
  _DB_NAME: ""