steps:
  # Step 1: Build image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${LOCATION}-docker.pkg.dev/$PROJECT_ID/${REPO}/teaching-agent-api:$COMMIT_SHA',
        '.'
      ]

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '${LOCATION}-docker.pkg.dev/$PROJECT_ID/${REPO}/teaching-agent-api:$COMMIT_SHA'
      ]

  # Step 3: Deploy on Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      [
        'gcloud',
        'run',
        'deploy',
        'teaching-agent-api',
        '--image',
        '${LOCATION}-docker.pkg.dev/$PROJECT_ID/${REPO}/teaching-agent-api:$COMMIT_SHA',
        '--region',
        'asia-south1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        '--set-env-vars',
        'OPENAI_API_KEY=${_OPENAI_API_KEY},DB_HOST=${_DB_HOST},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME}'
      ]

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _OPENAI_API_KEY: ""
  _DB_HOST: ""
  _DB_USER: ""
  _DB_PASS: ""
  _DB_NAME: ""
LOCATION: 'asia-south1'
REPO: 'teaching-agent-repo'
