steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/teaching-agent-api:$COMMIT_SHA', '.']

  # Step 2: Deploy to Cloud Run (updated to Artifact Registry Cloud SDK)
  - name: 'us-docker.pkg.dev/cloudsdktool/cloud-sdk:latest'
    args: [
        'gcloud', 'run', 'deploy', 'teaching-agent-api',
        '--image', 'gcr.io/$PROJECT_ID/teaching-agent-api:$COMMIT_SHA',
        '--region', 'asia-south1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--set-env-vars', 
        'OPENAI_API_KEY=${_OPENAI_API_KEY},DB_HOST=${_DB_HOST},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME}'
    ]
    dir: '.'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _OPENAI_API_KEY: ""
  _DB_HOST: ""
  _DB_USER: ""
  _DB_PASS: ""
  _DB_NAME: ""
